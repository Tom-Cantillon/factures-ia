[project]
name = "factures-ia"
version = "0.1.0"
description = "De la facture scannée à l'agent IA : S3 → OCR → bronze → silver → entrepôt → MCP → agent"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "boto3>=1.44.9",
    "duckdb>=2.0.1",
    "mcp>=2.3.0",
    "openai>=3.57.0",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "pymupdf>=2.1",
    "python-dotenv",
]

[project.scripts]
factures = "factures.cli:main"
factures-mcp = "factures.mcp_server:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factures"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
