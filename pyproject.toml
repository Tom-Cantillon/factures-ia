[project]
name = "factures-ia"
version = "0.1.0"
description = "De la facture scannée à l'agent IA : S3 → OCR → bronze → silver → entrepôt → MCP → agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factures"]
